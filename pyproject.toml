[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-vectorizers"
version = "0.1.0"
description = "Reusable dense and Japanese sparse vector encoders for RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.0",
    "sentence-transformers>=5.1.1",
    "sudachidict-core==20260116",
    "sudachipy==0.6.10",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.12.1,<1.17"]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=8.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_vectorizers"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
