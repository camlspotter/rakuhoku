[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rakuhoku"
version = "0.1.0"
description = "Dense, Japanese sparse, and hybrid Qdrant search for RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
    "qdrant-client>=1.16,<1.17",
    "sentence-transformers>=5.1.1",
    "sudachidict-core==20260116",
    "sudachipy==0.6.10",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=8.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rakuhoku"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
